# Busca spots en Wikimedia Commons y OpenStreetMap, los guarda en public/datos/spots.geojson y
# recalcula la previsión. Se lanza el día 1 de cada mes, a mano o al cambiar el código de descubrimiento.
name: Descubrir spots

on:
  schedule:
    - cron: "41 6 1 * *"      # día 1 de cada mes
  workflow_dispatch:
    inputs:
      zona:
        description: "Nombre de la zona"
        default: "Sierra de Madrid"
      bbox:
        description: "min_lon,min_lat,max_lon,max_lat"
        default: "-4.30,40.60,-3.55,41.10"
      publicar:
        description: "Publicar en la web (si no, solo se guarda como artefacto para revisar)"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - descubrir_spots.py
      - contaminacion.py
      - .github/workflows/descubrir.yml

permissions:
  contents: write

concurrency:
  group: publicar-datos
  cancel-in-progress: false

jobs:
  descubrir:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Las respuestas de Commons/Overpass se guardan entre ejecuciones: menos carga para Wikimedia
      - uses: actions/cache@v4
        with:
          path: cache
          key: apis-${{ github.run_id }}
          restore-keys: apis-

      - name: Buscar spots
        run: |
          python descubrir_spots.py \
            --zona "${{ inputs.zona || 'Sierra de Madrid' }}" \
            --bbox="${{ inputs.bbox || '-4.30,40.60,-3.55,41.10' }}" \
            --salida salida

      - name: Previsión con los spots nuevos
        run: python condiciones.py --spots salida/spots.geojson --salida salida/informe.json

      - uses: actions/upload-artifact@v4
        with:
          name: spots
          path: salida/
          retention-days: 14

      - name: Publicar
        if: github.event_name != 'workflow_dispatch' || inputs.publicar
        run: |
          cp salida/spots.geojson salida/spots.csv salida/informe.json public/datos/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add public/datos
          git diff --cached --quiet && exit 0
          git commit -m "Actualizar spots ($(date -u +%Y-%m-%d))"
          for i in 1 2 3 4; do git pull --rebase && git push && exit 0; sleep $((i * 5)); done
          exit 1
