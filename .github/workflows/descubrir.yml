# Una vez al mes vuelve a buscar spots en Wikimedia Commons y OSM y guarda el resultado en el repo.
name: Descubrir spots

on:
  schedule:
    - cron: "41 6 1 * *"      # día 1 de cada mes
  workflow_dispatch:
    inputs:
      zona:
        description: "Nombre de la zona"
        default: "Sierra de Madrid"
      bbox:
        description: "min_lon,min_lat,max_lon,max_lat"
        default: "-4.30,40.60,-3.55,41.10"

permissions:
  contents: write
  actions: write

jobs:
  descubrir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Buscar spots
        run: |
          python descubrir_spots.py \
            --zona "${{ inputs.zona || 'Sierra de Madrid' }}" \
            --bbox="${{ inputs.bbox || '-4.30,40.60,-3.55,41.10' }}"
      - name: Guardar resultados
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          mkdir -p docs/datos && cp salida/spots.geojson docs/datos/spots.geojson
          git add salida/spots.geojson salida/spots.csv salida/mapa.html docs/datos/spots.geojson
          git diff --cached --quiet && exit 0
          git commit -m "Actualizar spots"
          git pull --rebase
          git push
      - name: Recalcular previsión con los spots nuevos
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run datos.yml -f enviar=false
