# Tests del pipeline (pytest, sin red: respuestas de APIs guardadas) y build de la web.
name: Pruebas

on:
  push:
    branches: [main]
    paths-ignore:
      - public/datos/**
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
