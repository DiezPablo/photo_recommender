# Calidad y pruebas en cada push: pipeline Python (ruff + pytest, sin red: respuestas de APIs grabadas) y
# web (lint, tipos, build y Playwright en móvil y escritorio).
name: Pruebas

on:
  push:
    branches: [main]
    paths-ignore:
      - public/datos/**
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check rasante tests
      - name: Formato
        run: ruff format --check rasante tests
      - name: Tests
        run: python -m pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: capturas
          path: |
            capturas/
            test-results/
          retention-days: 7
