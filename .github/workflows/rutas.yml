# Rutas de senderismo de toda España: OpenStreetMap (extracto PBF de España, sin Overpass), senderos
# homologados FEDME y Caminos Naturales (IGN). Calcula desnivel, perfil y tiempo y publica rutas.json
# en la release "datos". Mensual: los senderos cambian poco.
name: Rutas

on:
  schedule:
    - cron: "23 4 8 * *" # día 8 de cada mes (lejos del descubrimiento de spots del día 1)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - rasante/rutas/**
      - .github/workflows/rutas.yml

permissions:
  contents: write

concurrency:
  group: rutas
  cancel-in-progress: false

jobs:
  rutas:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .

      # Teselas del terreno y respuestas del IGN entre ejecuciones
      - uses: actions/cache/restore@v6
        with:
          path: cache
          key: rutas-${{ github.run_id }}
          restore-keys: rutas-

      - name: Extracto de OpenStreetMap de España
        run: |
          for url in https://download.geofabrik.de/europe/spain-latest.osm.pbf \
                     https://download.openstreetmap.fr/extracts/europe/spain-latest.osm.pbf; do
            curl -fsSL --retry 3 -A "spots-paisaje/1.0 (proyecto personal; github.com/DiezPablo/photo_recommender)" \
              -o spain.osm.pbf "$url" && break
          done
          ls -la spain.osm.pbf

      - name: Calcular rutas
        run: |
          rm -rf cache/rutas      # el IGN se actualiza: se vuelve a pedir cada mes
          mkdir -p salida
          python -m rasante rutas --pbf spain.osm.pbf --salida salida

      - name: Publicar
        run: .github/scripts/publicar_release.sh "Actualizar rutas ($(date -u +%Y-%m-%d))" salida/rutas.json

      - uses: actions/cache/save@v6
        if: always()
        with:
          path: cache
          key: rutas-${{ github.run_id }}
