# Safaris: el catálogo curado (safaris.json) y todos los parques del mundo con fauna (safaris_mundo.json e
# índice para el buscador). La primera vez tarda horas (miles de parques); la caché guarda el progreso y cada
# ejecución pide a Overpass una tanda nueva de parques (alojamientos, operadores, puertas). Semanal.
name: Safaris

on:
  schedule:
    - cron: "13 3 * * 0" # domingos, lejos de Datos y de Rutas
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - rasante/safaris/**
      - rasante/recursos/safaris.csv
      - .github/workflows/safaris.yml

permissions:
  contents: write

concurrency:
  group: safaris
  cancel-in-progress: false

jobs:
  safaris:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .

      - uses: actions/cache/restore@v6
        with:
          path: cache
          key: safaris-v1-${{ github.run_id }}
          restore-keys: safaris-v1-

      # Los 65 parques escritos a mano: especies de iNaturalist, clima ERA5 y alojamientos (~1 h)
      - name: Catálogo
        continue-on-error: true
        run: python -m rasante safaris --salida salida/safaris.json

      # Todos los parques del mundo: Wikidata + GBIF + NASA + OurAirports + una tanda de OSM
      - name: Mundo
        continue-on-error: true
        timeout-minutes: 240
        run: python -m rasante safaris --mundo --osm-max 1200 --salida salida/safaris_mundo.json --indice salida/safaris_indice.json

      - uses: actions/cache/save@v6
        if: always()
        with:
          path: cache
          key: safaris-v1-${{ github.run_id }}

      - name: Publicar
        run: |
          ficheros=""
          for f in salida/safaris.json salida/safaris_mundo.json salida/safaris_indice.json; do
            [ -s "$f" ] && ficheros="$ficheros $f"
          done
          [ -n "$ficheros" ] || { echo "Nada que publicar"; exit 1; }
          .github/scripts/publicar_release.sh "Safaris ($(date -u +%Y-%m-%d))" $ficheros
