# Recalcula la previsión cada 3 horas y la publica en public/datos/ (Vercel redespliega la web
# con cada commit). La ejecución de la tarde además manda el aviso opcional por Telegram.
# GitHub interpreta el cron en UTC: 17:17 UTC = 19:17 en verano, 18:17 en invierno.
name: Datos

on:
  schedule:
    - cron: "23 */3 * * *"     # actualizar datos
    - cron: "17 17 * * *"      # actualizar datos + aviso de la tarde
  workflow_dispatch:
    inputs:
      enviar:
        description: "Enviar aviso por Telegram (si hay secretos)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - condiciones.py
      - puntuacion.py
      - astro.py
      - mis_spots.csv
      - .github/workflows/datos.yml

permissions:
  contents: write

concurrency:
  group: publicar-datos
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: cache/lp
          key: atlas-lp-2025

      - name: Calcular condiciones
        run: python condiciones.py --salida public/datos/informe.json

      - name: Publicar datos
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add public/datos/informe.json
          git diff --cached --quiet && exit 0
          git commit -m "Datos $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do git pull --rebase && git push && exit 0; sleep $((i * 5)); done
          exit 1

      - name: Aviso por Telegram (opcional)
        if: github.event.schedule == '17 17 * * *' || inputs.enviar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEB_URL: https://photo-recommender.vercel.app
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Sin secretos de Telegram: no se envía aviso."; exit 0
          fi
          python notificar.py --silencio
