# Recalcula la previsión cada 6 horas y la publica junto a la Mini App (docs/datos/).
# La ejecución de la tarde además envía el aviso por Telegram.
# GitHub interpreta el cron en UTC: 17:17 UTC = 19:17 en verano, 18:17 en invierno.
name: Datos y alertas

on:
  schedule:
    - cron: "23 */6 * * *"     # actualizar datos
    - cron: "17 17 * * *"      # actualizar datos + aviso de la tarde
  workflow_dispatch:
    inputs:
      enviar:
        description: "Enviar aviso por Telegram"
        default: "true"

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Calcular condiciones
        run: |
          mkdir -p docs/datos
          [ -f salida/spots.geojson ] && cp salida/spots.geojson docs/datos/spots.geojson
          python condiciones.py --dias 4 --salida docs/datos/informe.json

      - name: Publicar datos
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/datos
          git diff --cached --quiet && exit 0
          git commit -m "Datos $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push

      - name: Enviar aviso por Telegram
        if: github.event.schedule == '17 17 * * *' || (github.event_name == 'workflow_dispatch' && inputs.enviar == 'true')
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notificar.py --informe docs/datos/informe.json --silencio
