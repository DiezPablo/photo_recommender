<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Spots de paisaje</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f2f5);
    --txt: var(--tg-theme-text-color, #16181d);
    --hint: var(--tg-theme-hint-color, #8a8f98);
    --acc: var(--tg-theme-button-color, #2f7de1);
    --acc-txt: var(--tg-theme-button-text-color, #ffffff);
    --n-top: #1f9d55; --n-bien: #7cb342; --n-medio: #f0a030; --n-flojo: #9aa0a6;
    --sombra: 0 2px 12px rgba(0,0,0,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-tg]) { --bg:#17191e; --bg2:#22252c; --txt:#eceef2; --hint:#8d939c; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--txt);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow:hidden; }
  #app { display:flex; flex-direction:column; height:100%; }

  header { padding:8px 10px 6px; background:var(--bg); z-index:500; box-shadow:0 1px 0 rgba(0,0,0,.06); }
  .fila { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding:2px 0; }
  .fila::-webkit-scrollbar { display:none; }
  .chip { flex:none; border:0; border-radius:16px; padding:6px 12px; background:var(--bg2); color:var(--txt);
    font:inherit; font-size:14px; cursor:pointer; white-space:nowrap; }
  .chip.on { background:var(--acc); color:var(--acc-txt); }
  .chip small { opacity:.7; margin-left:3px; }
  .barra { display:flex; justify-content:space-between; align-items:center; margin-top:4px; }
  .vista { display:flex; background:var(--bg2); border-radius:9px; padding:2px; }
  .vista button { border:0; background:none; color:var(--txt); font:inherit; font-size:13px; padding:4px 12px; border-radius:7px; }
  .vista button.on { background:var(--bg); box-shadow:0 1px 3px rgba(0,0,0,.15); }
  #actualizado { font-size:12px; color:var(--hint); }

  main { position:relative; flex:1; min-height:0; }
  #mapa, #lista { position:absolute; inset:0; }
  #mapa { z-index:0; }   /* encierra los controles de Leaflet bajo la ficha */
  #lista { overflow-y:auto; background:var(--bg); padding:6px 10px 90px; display:none; }
  .vacio { padding:40px 20px; text-align:center; color:var(--hint); }

  .pin { width:30px; height:30px; border-radius:50%; display:grid; place-items:center; color:#fff;
    font-weight:700; font-size:12px; border:2px solid #fff; box-shadow:var(--sombra); }
  .yo { width:16px; height:16px; border-radius:50%; background:#2f7de1; border:3px solid #fff; box-shadow:0 0 0 6px rgba(47,125,225,.25); }
  .leaflet-container { background:var(--bg2); font:inherit; }

  #ubicar { position:absolute; right:12px; bottom:20px; z-index:450; width:44px; height:44px; border-radius:50%;
    border:0; background:var(--bg); color:var(--txt); font-size:20px; box-shadow:var(--sombra); }

  .item { display:flex; gap:10px; align-items:center; padding:10px 4px; border-bottom:1px solid var(--bg2); cursor:pointer; }
  .nota { flex:none; min-width:42px; height:30px; border-radius:15px; color:#fff; font-weight:700;
    display:grid; place-items:center; font-size:14px; }
  .item .t { flex:1; min-width:0; }
  .item b { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item span { color:var(--hint); font-size:13px; }

  #ficha { position:absolute; left:0; right:0; bottom:0; z-index:600; max-height:72%; overflow-y:auto;
    background:var(--bg); border-radius:16px 16px 0 0; box-shadow:0 -4px 20px rgba(0,0,0,.2);
    padding:6px 14px calc(16px + env(safe-area-inset-bottom)); transform:translateY(105%); transition:transform .25s ease; }
  #ficha.abierta { transform:none; }
  .asa { width:38px; height:4px; border-radius:2px; background:var(--hint); opacity:.4; margin:4px auto 10px; }
  #ficha h2 { margin:0; font-size:19px; }
  .sub { color:var(--hint); font-size:13px; margin:2px 0 10px; }
  .dias-ficha { margin-bottom:8px; }
  .momento { background:var(--bg2); border-radius:12px; padding:10px 12px; margin-bottom:8px; display:flex; gap:10px; }
  .momento .cuerpo { flex:1; }
  .momento .cab { font-weight:600; }
  .momento .det { font-size:13px; color:var(--hint); margin-top:2px; }
  .fotos { display:flex; gap:6px; overflow-x:auto; margin:6px 0 10px; }
  .fotos img { height:84px; border-radius:8px; flex:none; cursor:pointer; background:var(--bg2); }
  .acciones { display:flex; gap:8px; }
  .btn { flex:1; border:0; border-radius:10px; padding:11px; font:inherit; font-weight:600; background:var(--acc); color:var(--acc-txt); }
  .btn.sec { background:var(--bg2); color:var(--txt); }
  .cerrar { position:absolute; right:10px; top:8px; border:0; background:var(--bg2); color:var(--txt);
    width:30px; height:30px; border-radius:50%; font-size:16px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="fila" id="dias"></div>
    <div class="fila" id="momentos"></div>
    <div class="barra">
      <div class="vista"><button id="v-mapa" class="on">Mapa</button><button id="v-lista">Ranking</button></div>
      <span id="actualizado"></span>
    </div>
  </header>
  <main>
    <div id="mapa"></div>
    <div id="lista"></div>
    <button id="ubicar" title="Mi ubicación" aria-label="Mi ubicación">📍</button>
    <section id="ficha" aria-live="polite"></section>
  </main>
</div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg && tg.initData !== undefined) {
  document.documentElement.dataset.tg = "1";
  tg.ready(); tg.expand();
  if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();   // para poder arrastrar el mapa
}

const ICONOS = { amanecer: "🌅", atardecer: "🌇", astro: "🌌", niebla: "🌫️" };
const MOMENTOS = ["todos", "amanecer", "atardecer", "astro", "niebla"];
const DIAS = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];
const estado = { dia: null, momento: "todos", vista: "mapa", yo: null, abierto: null };
let resultados = [], extras = {}, mapa, capa, marcadorYo;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const colorNota = n => n >= 8 ? "var(--n-top)" : n >= 6.5 ? "var(--n-bien)" : n >= 5 ? "var(--n-medio)" : "var(--n-flojo)";
const hoyISO = () => new Date().toLocaleDateString("sv-SE", { timeZone: "Europe/Madrid" });
const abrirEnlace = url => tg && tg.openLink ? tg.openLink(url) : window.open(url, "_blank");

function etiquetaDia(f) {
  const hoy = hoyISO(), d = new Date(f + "T12:00:00");
  const delta = Math.round((d - new Date(hoy + "T12:00:00")) / 864e5);
  return delta === 0 ? "Hoy" : delta === 1 ? "Mañana" : `${DIAS[d.getDay()]} ${d.getDate()}`;
}
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const nombresMeses = s => String(s).split(",").map(m => MESES[Number(m) - 1]).filter(Boolean).join(", ");
function distKm(a, b, c, d) {
  const r = Math.PI / 180, x = Math.sin((c - a) * r / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin((d - b) * r / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(x));
}

async function cargar() {
  const sinCache = `?t=${Math.floor(Date.now() / 6e5)}`;
  const [inf, geo] = await Promise.all([
    fetch("datos/informe.json" + sinCache).then(r => r.ok ? r.json() : { resultados: [] }).catch(() => ({ resultados: [] })),
    fetch("datos/spots.geojson" + sinCache).then(r => r.ok ? r.json() : { features: [] }).catch(() => ({ features: [] })),
  ]);
  resultados = inf.resultados || [];
  for (const f of geo.features || []) extras[f.properties.nombre] = f.properties;
  if (inf.generado) {
    const g = new Date(inf.generado);
    document.getElementById("actualizado").textContent =
      `Actualizado ${etiquetaDia(g.toLocaleDateString("sv-SE", { timeZone: "Europe/Madrid" })).toLowerCase()} ${g.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Madrid" })}`;
  }
  const fechas = [...new Set(resultados.map(r => r.fecha))].filter(f => f >= hoyISO()).sort();
  const hora = Number(new Date().toLocaleString("es-ES", { hour: "numeric", hour12: false, timeZone: "Europe/Madrid" }));
  estado.dia = (hora >= 21 && fechas[1]) ? fechas[1] : fechas[0] || null;
  pintarChips(fechas);
  iniciarMapa();
  pintar();
}

function pintarChips(fechas) {
  const dias = document.getElementById("dias");
  dias.innerHTML = fechas.map(f => `<button class="chip${f === estado.dia ? " on" : ""}" data-dia="${f}">${etiquetaDia(f)}</button>`).join("")
    || `<span class="vacio" style="padding:4px">Sin previsión todavía</span>`;
  dias.onclick = e => { const b = e.target.closest("[data-dia]"); if (!b) return; estado.dia = b.dataset.dia; marcar(dias, b); pintar(); };
  const mom = document.getElementById("momentos");
  mom.innerHTML = MOMENTOS.map(m => `<button class="chip${m === estado.momento ? " on" : ""}" data-m="${m}">${m === "todos" ? "Todo" : ICONOS[m] + " " + m[0].toUpperCase() + m.slice(1)}</button>`).join("");
  mom.onclick = e => { const b = e.target.closest("[data-m]"); if (!b) return; estado.momento = b.dataset.m; marcar(mom, b); pintar(); };
}
function marcar(fila, boton) { fila.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === boton)); tg?.HapticFeedback?.selectionChanged(); }

// Mejor resultado de cada spot para el día y momento elegidos
function mejores() {
  const porSpot = new Map();
  for (const r of resultados) {
    if (r.fecha !== estado.dia || (estado.momento !== "todos" && r.momento !== estado.momento)) continue;
    const prev = porSpot.get(r.spot);
    if (!prev || r.nota > prev.nota) porSpot.set(r.spot, r);
  }
  return [...porSpot.values()].sort((a, b) => b.nota - a.nota);
}

function iniciarMapa() {
  mapa = L.map("mapa", { zoomControl: false, attributionControl: true });
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18, attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(mapa);
  capa = L.layerGroup().addTo(mapa);
  const todos = resultados.map(r => [r.lat, r.lon]);
  todos.length ? mapa.fitBounds(todos, { padding: [40, 40], maxZoom: 12 }) : mapa.setView([40.75, -3.95], 9);
  mapa.on("click", cerrarFicha);
}

function pintar() {
  const lista = mejores();
  capa.clearLayers();
  for (const r of lista) {
    const icono = L.divIcon({ className: "", iconSize: [30, 30], iconAnchor: [15, 15],
      html: `<div class="pin" style="background:${colorNota(r.nota)}">${r.nota.toFixed(r.nota % 1 ? 1 : 0)}</div>` });
    L.marker([r.lat, r.lon], { icon: icono, title: r.spot, zIndexOffset: Math.round(r.nota * 100) })
      .on("click", e => { L.DomEvent.stopPropagation(e); abrirFicha(r.spot); }).addTo(capa);
  }
  const cont = document.getElementById("lista");
  cont.innerHTML = lista.length ? lista.map(r => {
    const d = estado.yo ? ` · ${distKm(estado.yo[0], estado.yo[1], r.lat, r.lon).toFixed(0)} km` : "";
    return `<div class="item" data-spot="${esc(r.spot)}">
      <div class="nota" style="background:${colorNota(r.nota)}">${r.nota}</div>
      <div class="t"><b>${esc(r.spot)}</b><span>${ICONOS[r.momento] || ""} ${r.momento} ${r.hora}${d}</span></div></div>`;
  }).join("") : `<div class="vacio">Nada para este filtro.</div>`;
  cont.onclick = e => { const it = e.target.closest("[data-spot]"); if (!it) return; abrirFicha(it.dataset.spot, true); };
  if (estado.abierto) abrirFicha(estado.abierto);
}

function abrirFicha(nombre, centrar = false) {
  estado.abierto = nombre;
  const filas = resultados.filter(r => r.spot === nombre);
  if (!filas.length) return cerrarFicha();
  const r0 = filas[0], ex = extras[nombre] || {};
  const delDia = filas.filter(r => r.fecha === estado.dia).sort((a, b) => a.hora.localeCompare(b.hora));
  const dist = estado.yo ? ` · a ${distKm(estado.yo[0], estado.yo[1], r0.lat, r0.lon).toFixed(0)} km` : "";
  const origen = r0.origen === "propio" ? "spot propio"
    : r0.origen === "osm" ? "mirador de OpenStreetMap"
    : ex.fotografos ? `${ex.fotografos} autores en Wikimedia Commons${ex.fotos_calidad ? `, ${ex.fotos_calidad} fotos de calidad` : ""}` : null;
  const sub = [r0.tipo, origen].filter(Boolean).join(" · ");
  const creditos = (ex.creditos_ejemplo || []).filter(Boolean);
  const fotos = (ex.fotos_ejemplo || []).map((u, i) =>
    `<img src="${esc(u)}" alt="" loading="lazy" onerror="this.remove()" data-url="${esc((ex.enlaces_ejemplo || [])[i] || u)}">`).join("");
  const ficha = document.getElementById("ficha");
  ficha.innerHTML = `<div class="asa"></div><button class="cerrar" aria-label="Cerrar">✕</button>
    <h2>${esc(nombre)}</h2><div class="sub">${esc(sub)}${dist}</div>
    <div class="sub">${etiquetaDia(estado.dia)}</div>
    ${delDia.length ? delDia.map(r => `<div class="momento">
      <div class="nota" style="background:${colorNota(r.nota)}">${r.nota}</div>
      <div class="cuerpo"><div class="cab">${ICONOS[r.momento] || ""} ${r.momento[0].toUpperCase() + r.momento.slice(1)} · ${r.hora}</div>
      ${r.ventana ? `<div class="det">${esc(r.ventana)}</div>` : ""}<div class="det">${esc(r.detalle)}</div></div></div>`).join("")
      : `<div class="vacio" style="padding:10px">Sin nada destacable este día.</div>`}
    ${fotos ? `<div class="fotos">${fotos}</div>
      <div class="sub" style="font-size:11px">Fotos: ${esc(creditos.join(" · "))} · Wikimedia Commons</div>` : ""}
    ${ex.meses_top ? `<div class="sub">Más fotografiado en ${esc(nombresMeses(ex.meses_top))}</div>` : ""}
    <div class="acciones"><button class="btn" id="llegar">Cómo llegar</button></div>`;
  ficha.classList.add("abierta");
  ficha.querySelector(".cerrar").onclick = cerrarFicha;
  ficha.querySelector("#llegar").onclick = () => abrirEnlace(`https://www.google.com/maps/dir/?api=1&destination=${r0.lat},${r0.lon}`);
  ficha.querySelectorAll(".fotos img").forEach(img => img.onclick = () => abrirEnlace(img.dataset.url));
  if (centrar) { cambiarVista("mapa"); mapa.flyTo([r0.lat, r0.lon], Math.max(mapa.getZoom(), 12), { duration: .6 }); }
  if (tg?.BackButton) { tg.BackButton.show(); tg.BackButton.onClick(cerrarFicha); }
}
function cerrarFicha() {
  estado.abierto = null;
  document.getElementById("ficha").classList.remove("abierta");
  if (tg?.BackButton) { tg.BackButton.hide(); tg.BackButton.offClick(cerrarFicha); }
}

function cambiarVista(v) {
  estado.vista = v;
  document.getElementById("v-mapa").classList.toggle("on", v === "mapa");
  document.getElementById("v-lista").classList.toggle("on", v === "lista");
  document.getElementById("lista").style.display = v === "lista" ? "block" : "none";
  document.getElementById("ubicar").style.display = v === "mapa" ? "block" : "none";
  if (v === "mapa") setTimeout(() => mapa.invalidateSize(), 0);
}
document.getElementById("v-mapa").onclick = () => cambiarVista("mapa");
document.getElementById("v-lista").onclick = () => { cerrarFicha(); cambiarVista("lista"); };

function ponerYo(lat, lon) {
  estado.yo = [lat, lon];
  if (marcadorYo) marcadorYo.setLatLng(estado.yo);
  else marcadorYo = L.marker(estado.yo, { icon: L.divIcon({ className: "", html: '<div class="yo"></div>', iconSize: [16, 16] }), interactive: false }).addTo(mapa);
  mapa.flyTo(estado.yo, 10, { duration: .6 });
  pintar();
}
document.getElementById("ubicar").onclick = () => {
  const lm = tg?.LocationManager;
  const fallo = () => tg?.showAlert ? tg.showAlert("No he podido obtener tu ubicación.") : alert("No he podido obtener tu ubicación.");
  if (lm && tg.isVersionAtLeast && tg.isVersionAtLeast("8.0")) {
    lm.init(() => {
      if (!lm.isLocationAvailable) return fallo();
      lm.getLocation(loc => loc ? ponerYo(loc.latitude, loc.longitude) : fallo());
    });
  } else if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(p => ponerYo(p.coords.latitude, p.coords.longitude), fallo, { timeout: 10000 });
  } else fallo();
};

cargar();
</script>
</body>
</html>
